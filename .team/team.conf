# .team/team.conf: sourced by team.sh. Edit to suit your setup.
# shellcheck shell=bash

# ---- Fallback order (first available worker that succeeds wins) ----
BUILD_CHAIN="gemini kimi codex"     # writes code
REVIEW_CHAIN="codex gemini kimi"    # reviews diffs (read-only)
ASK_CHAIN="gemini kimi codex"       # research questions (read-only)

# ---- Limits ----
TIMEOUT_SECS=1200                   # per worker attempt
MAX_DIFF_BYTES=150000               # review diffs larger than this get truncated
PROTECTED_BRANCHES="main master"    # build refuses to run on these

# ---- Verify ----
# Priority: VERIFY_CMD below > "Verify" line in AGENTS.md > auto-detect (npm/pytest/cargo/go/make)
VERIFY_CMD=""

# ---- Rate-limit / quota detection ----
# When a worker exits non-zero, or exits 0 with no "RESULT:"/"VERDICT:" line,
# and its output matches this pattern, it counts as "quota" and the next worker is tried.
QUOTA_PATTERN='quota|rate.?limit|usage limit|RESOURCE_EXHAUSTED|too many requests|\b429\b|limit reached|exceeded your|insufficient (credit|balance)|try again (later|in )'

# ---- Optional model overrides (empty = each CLI's default) ----
GEMINI_MODEL=""   # e.g. gemini-2.5-pro
KIMI_MODEL=""     # a model alias from your kimi config
CODEX_MODEL=""    # e.g. gpt-5-codex

# =====================================================================
# Worker adapters. Each gets: $1 = write|read, $2 = prompt file, $3 = output file.
# Print the worker's answer to stdout. Writing $3 is optional; if it is
# left empty, team.sh uses stdout as the report.
# If a CLI changes its flags, fix only the function below.
# =====================================================================

run_gemini() {   # Gemini CLI: npm i -g @google/gemini-cli
  local mode=$1 pf=$2
  local args=(-p "$(cat "$pf")")
  [ -n "$GEMINI_MODEL" ] && args+=(-m "$GEMINI_MODEL")
  # write: auto-approve edits and shell commands. read: default mode, where headless
  # runs allow read tools and refuse anything that needs approval.
  [ "$mode" = write ] && args+=(--approval-mode yolo)
  gemini "${args[@]}"
}

run_kimi() {     # Kimi Code CLI. -p is non-interactive with auto permission
                 # (per the docs it cannot be combined with --yolo/--plan).
                 # Older kimi-cli builds used:  kimi --print -c "<prompt>"
  local mode=$1 pf=$2
  local args=(-p "$(cat "$pf")")
  [ -n "$KIMI_MODEL" ] && args+=(-m "$KIMI_MODEL")
  # Kimi has no read-only flag that works with -p, so read mode relies on the
  # prompt, and team.sh warns if files changed anyway.
  kimi "${args[@]}"
}

run_codex() {    # Codex CLI: npm i -g @openai/codex
  local mode=$1 pf=$2 of=$3
  local args=(exec --skip-git-repo-check -o "$of")
  [ -n "$CODEX_MODEL" ] && args+=(-m "$CODEX_MODEL")
  if [ "$mode" = write ]; then args+=(--full-auto); else args+=(--sandbox read-only); fi
  codex "${args[@]}" - < "$pf"   # "-" = read the prompt from stdin
}
